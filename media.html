<!doctype html>
<html lang="hy">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Մեդիա — Խաչատրյաններ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="brand">
          <img src="images/logos/logo.avif" alt="Խաչատրյաններ" class="logo" />
          <span class="brand-title">Խաչատրյաններ</span>
        </a>
      </div>
    </header>

    <main class="container page-content">
      <a href="index.html" class="back-link">← Գլխավոր էջ</a>

      <article class="media-article">
        <h1>Մեդիա</h1>
        <p id="media-status" class="media-status" aria-live="polite">Լուսանկարները բեռնվում են...</p>
        <div id="media-gallery" class="media-gallery"></div>
      </article>
    </main>

    <footer class="site-footer">
      <div class="container">
        <small>© Խաչատրյաններ</small>
      </div>
    </footer>
    <div id="media-lightbox" class="image-lightbox" hidden>
      <button type="button" class="image-lightbox-close" aria-label="Փակել">X</button>
      <img id="media-lightbox-image" src="" alt="" />
    </div>
    <script src="media-lightbox.js"></script>
    <script src="media.js"></script>
  </body>
</html>
